<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandbach United — Matchday Live</title>
  <style>
    :root {
      --navy: #0c2340;
      --royal: #1c5fae;
      --amber: #f2a71b;
      --paper: #eef1f6;
      --ink: #14202b;
      --muted: #6b7785;
      --line: #e3e7ee;
    }
    body {
      font-family: system-ui, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 0 16px;
      background: var(--paper);
      color: var(--ink);
    }
    h1 { color: var(--navy); font-size: 20px; margin: 0; }
    a.back { display: inline-block; margin-bottom: 16px; color: var(--royal); text-decoration: none; }
    .card {
      background: white;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 1px 3px rgba(12,35,64,0.08);
    }
    .card h2 {
      margin: 0 0 12px 0;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--navy);
    }
    .score { font-size: 28px; font-weight: 700; color: var(--navy); text-align: center; }
    .teams { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
    .disclaimer { font-size: 11px; color: var(--muted); margin-top: 8px; font-style: italic; }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 16px;
    }
    .status-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .status-live {
      background: rgba(242,167,27,0.15);
      border: 1px solid var(--amber);
      color: #b57a00;
    }
    .status-upcoming { background: var(--paper); color: var(--muted); }
    .status-finished { background: var(--paper); color: var(--muted); }

    .donut-row { display: flex; justify-content: space-between; gap: 8px; }
    .donut-wrap { text-align: center; flex: 1; }
    .donut {
      width: 70px; height: 70px;
      border-radius: 50%;
      margin: 0 auto 6px;
      position: relative;
    }
    .donut::after {
      content: '';
      position: absolute;
      top: 12px; left: 12px;
      width: 46px; height: 46px;
      border-radius: 50%;
      background: white;
    }
    .donut-label { font-size: 11px; color: var(--muted); }
    .donut-split { font-size: 10px; color: var(--ink); margin-top: 2px; }

    ul { margin: 0; padding-left: 18px; font-size: 14px; }
    li { margin-bottom: 4px; }
    .empty { color: var(--muted); font-size: 13px; }

    .btn {
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: white;
      color: var(--navy);
      cursor: pointer;
      font-weight: 600;
    }

    .carousel {
      overflow: hidden;
      position: relative;
      touch-action: pan-y;
      transition: height 0.2s ease;
      width: 100%;
      max-width: 100%;
    }
    .carousel-track {
      display: flex;
      transition: transform 0.3s ease;
      align-items: flex-start;
      width: 100%;
    }
    .carousel-track > div {
      flex: 0 0 100%;
      min-width: 0;
      box-sizing: border-box;
      max-height: 320px;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .carousel-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
      width: 100%;
      flex-wrap: nowrap;
    }
    .carousel-nav button {
      border: none; background: var(--paper); width: 28px; height: 28px;
      border-radius: 50%; cursor: pointer; font-size: 16px; line-height: 1; color: var(--navy);
    }
    .carousel-dots { display: flex; gap: 6px; align-items: center; }
    .carousel-dots span {
      width: 8px; height: 8px; border-radius: 50%; background: #ccd3dd; cursor: pointer; display: inline-block;
    }
    .carousel-dots span.active { background: var(--royal); }
    .carousel-count { font-size: 12px; color: var(--muted); min-width: 32px; text-align: center; }
  </style>
</head>
<body>
  <a class="back" href="index.html">← Back</a>

  <div class="header-row">
    <h1 id="page-title">Matchday Live</h1>
    <span class="status-badge" id="status-badge"></span>
  </div>

  <div id="content">Loading...</div>

  <script>
    function donut(homePct, awayPct, homeColor, awayColor) {
      const homeDeg = (homePct / 100) * 360;
      return `background: conic-gradient(${homeColor} 0deg ${homeDeg}deg, ${awayColor} ${homeDeg}deg 360deg);`;
    }

    function renderDonut(label, homePct, awayPct) {
      const h = Math.round(homePct ?? 50);
      const a = Math.round(awayPct ?? 50);
      return `
        <div class="donut-wrap">
          <div class="donut" style="${donut(h, a, 'var(--royal)', 'var(--amber)')}"></div>
          <div class="donut-label">${label}</div>
          <div class="donut-split">${h}% / ${a}%</div>
        </div>
      `;
    }

    function renderXGDonut(label, homeXG, awayXG) {
      const h = homeXG ?? 0;
      const a = awayXG ?? 0;
      const total = h + a;
      const homePct = total > 0 ? (h / total) * 100 : 50;
      const awayPct = 100 - homePct;

      return `
        <div class="donut-wrap">
          <div class="donut" style="${donut(homePct, awayPct, 'var(--royal)', 'var(--amber)')}"></div>
          <div class="donut-label">${label}</div>
          <div class="donut-split">${h.toFixed(1)} / ${a.toFixed(1)}</div>
        </div>
      `;
    }

    function listOrEmpty(items, formatter) {
      if (!items || items.length === 0) return '<div class="empty">None recorded</div>';
      return '<ul>' + items.map(formatter).join('') + '</ul>';
    }

    function renderPost(p) {
      const time = new Date(p.createdAt).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      const textHtml = p.text
        .replace(/(https?:\/\/\S+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
        .replace(/\n/g, '<br>');
      const imageHtml = (p.images && p.images.length > 0)
        ? `<img src="${p.images[0]}" style="width: 100%; border-radius: 6px; margin-top: 6px;" alt="Post image">`
        : '';
      const sideLabel = p.side === 'home' ? 'HOME' : 'AWAY';

      return `
        <div style="padding: 4px 2px 0;">
          <div style="font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: 0.5px;">${sideLabel} · @${p.handle} · ${time}</div>
          <div style="font-size: 13px; margin-top: 3px;">${textHtml}</div>
          ${imageHtml}
        </div>
      `;
    }

    function createCarousel(trackId, dotsId, countId) {
      let index = 0;
      let count = 0;
      const track = document.getElementById(trackId);
      const container = track.parentElement;

      function update() {
        const width = container.clientWidth;
        track.style.transform = `translateX(${-index * width}px)`;

        const activeSlide = track.children[index];
        if (activeSlide) {
          container.style.height = Math.min(activeSlide.scrollHeight, 320) + 'px';
        }

        const dotsEl = document.getElementById(dotsId);
        if (dotsEl) {
          if (count <= 10) {
            dotsEl.innerHTML = Array.from({ length: count }).map((_, i) =>
              `<span class="${i === index ? 'active' : ''}" onclick="window['${trackId}_api'].goTo(${i})"></span>`
            ).join('');
          } else {
            dotsEl.innerHTML = ''; // too many slides for individual dots — rely on the count text instead
          }
        }
        const countEl = document.getElementById(countId);
        if (countEl) countEl.textContent = count > 0 ? `${index + 1} / ${count}` : '';
      }

      function goTo(i) {
        index = Math.max(0, Math.min(count - 1, i));
        update();
      }

      const api = {
        next: () => goTo(index + 1),
        prev: () => goTo(index - 1),
        goTo,
        setCount: (n) => { count = n; index = 0; update(); },
      };

      let touchStartX = 0;
      container.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
      container.addEventListener('touchend', e => {
        const diff = touchStartX - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 40) { diff > 0 ? api.next() : api.prev(); }
      });

      window.addEventListener('resize', update);
      window[`${trackId}_api`] = api;
      return api;
    }

    function getFallbackStatus(fixtureDate, kickoff) {
      if (!fixtureDate || !kickoff) return { label: '', className: '' };
      const [hh, min] = kickoff.split(':');
      const kickoffTime = new Date(`${fixtureDate}T${hh}:${min}:00Z`);
      const isBST = kickoffTime.getUTCMonth() > 2 && kickoffTime.getUTCMonth() < 9;
      const kickoffUTC = new Date(kickoffTime.getTime() - (isBST ? 60 * 60 * 1000 : 0));
      const now = new Date();
      const minutesSinceKickoff = (now - kickoffUTC) / 60000;

      if (minutesSinceKickoff < 0) return { label: 'Upcoming', className: 'status-upcoming' };
      if (minutesSinceKickoff <= 45) return { label: `Live — ${Math.floor(minutesSinceKickoff)}'`, className: 'status-live' };
      if (minutesSinceKickoff <= 60) return { label: 'Half Time', className: 'status-live' };
      if (minutesSinceKickoff <= 105) return { label: `Live — ${Math.floor(minutesSinceKickoff - 15)}'`, className: 'status-live' };
      return { label: 'Full Time', className: 'status-finished' };
    }

    function getDisplayStatus(data) {
      const stageLabels = {
        scheduled: { label: 'Upcoming', className: 'status-upcoming' },
        first_half: { label: 'Live — 1st Half', className: 'status-live' },
        half_time: { label: 'Half Time', className: 'status-live' },
        second_half: { label: 'Live — 2nd Half', className: 'status-live' },
        extra_time: { label: 'Extra Time', className: 'status-live' },
        penalties: { label: 'Penalties', className: 'status-live' },
        full_time: { label: 'Full Time', className: 'status-finished' },
      };
      const stage = data.match?.matchStage;
      if (stage && stageLabels[stage]) return stageLabels[stage];
      return getFallbackStatus(data.fixtureDate, data.kickoff);
    }

    const params = new URLSearchParams(window.location.search);
    const dateParam = params.get('date');
    const fileToLoad = dateParam ? `matchday-archive/${dateParam}.json` : 'matchday-live.json';

    fetch(fileToLoad + '?t=' + Date.now())
      .then(res => res.json())
      .then(data => {
        const m = data.match;
        document.getElementById('page-title').textContent = `${data.homeTeam} vs ${data.awayTeam}`;

        const status = getDisplayStatus(data);
        const badge = document.getElementById('status-badge');
        badge.textContent = status.label;
        badge.className = 'status-badge ' + status.className;

        const html = `
          <div class="card">
            <div class="score">${m.score || '0 - 0'}</div>
            <div class="teams"><span>${data.homeTeam}</span><span>${data.awayTeam}</span></div>
          </div>

          <div class="card">
            <h2>Live Updates</h2>
            <div class="carousel" id="posts-carousel">
              <div class="carousel-track" id="posts-track"></div>
            </div>
            <div class="carousel-nav">
              <button onclick="postsCarousel.prev()">‹</button>
              <div class="carousel-count" id="posts-count"></div>
              <div class="carousel-dots" id="posts-dots"></div>
              <button onclick="postsCarousel.next()">›</button>
            </div>
          </div>

          ${m.wentToExtraTime ? `
          <div class="card">
            <h2>Extra Time</h2>
            <div class="score">${m.extraTime?.score || 'Score unknown'}</div>
            ${listOrEmpty(m.extraTime?.goals, g => `<li>${g.minute ? g.minute + "' " : ''}${g.scorer} (${g.team})</li>`)}
          </div>
          ` : ''}

          ${m.wentToPenalties ? `
          <div class="card">
            <h2>Penalties</h2>
            <div class="score">${m.penalties?.finalScore || 'Unknown'}</div>
            ${listOrEmpty(m.penalties?.takers, t => `<li>${t.player} (${t.team}) — ${t.scored ? 'Scored' : 'Missed'}</li>`)}
          </div>
          ` : ''}

          <div class="card">
            <h2>Rough xG (estimated)</h2>
            <div class="donut-row">
              ${renderXGDonut('1st Half', m.roughXG?.firstHalf?.home, m.roughXG?.firstHalf?.away)}
              ${renderXGDonut('2nd Half', m.roughXG?.secondHalf?.home, m.roughXG?.secondHalf?.away)}
              ${m.wentToExtraTime ? renderXGDonut('Extra Time', m.roughXG?.extraTime?.home, m.roughXG?.extraTime?.away) : renderXGDonut('Total', m.roughXG?.total?.home, m.roughXG?.total?.away)}
            </div>
            <div class="disclaimer">${m.roughXG?.disclaimer || ''}</div>
          </div>

          <div class="card">
            <h2>Match Control (estimated)</h2>
            <div class="donut-row">
              ${renderDonut('1st Half', m.matchControl?.firstHalf?.home, m.matchControl?.firstHalf?.away)}
              ${renderDonut('2nd Half', m.matchControl?.secondHalf?.home, m.matchControl?.secondHalf?.away)}
              ${m.wentToExtraTime ? renderDonut('Extra Time', m.matchControl?.extraTime?.home, m.matchControl?.extraTime?.away) : renderDonut('Total', m.matchControl?.total?.home, m.matchControl?.total?.away)}
            </div>
            <div class="disclaimer">${m.matchControl?.disclaimer || ''}</div>
          </div>

          <div class="card">
            <h2>Goals</h2>
            ${listOrEmpty(m.goals, g => `<li>${g.minute ? g.minute + "' " : ''}${g.scorer} (${g.team})</li>`)}
          </div>

          <div class="card">
            <h2>Cards</h2>
            ${listOrEmpty([...(m.yellowCards || []).map(c => ({...c, type: 'Yellow'})), ...(m.redCards || []).map(c => ({...c, type: 'Red'}))],
              c => `<li>${c.type} — ${c.minute ? c.minute + "' " : ''}${c.player} (${c.team})</li>`)}
          </div>

          <div class="card">
            <h2>Substitutions</h2>
            ${listOrEmpty(m.substitutions, s => `<li>${s.minute ? s.minute + "' " : ''}${s.playerOn} → ${s.playerOff} (${s.team})</li>`)}
          </div>

          <div class="card">
            <h2>Sin Bins</h2>
            ${listOrEmpty(m.sinBins, s => `<li>${s.minute ? s.minute + "' " : ''}${s.player} (${s.team})</li>`)}
          </div>

          <div class="card">
            <h2>Injuries</h2>
            ${listOrEmpty(m.injuries, i => `<li>${i.player} (${i.team})${i.note ? ' — ' + i.note : ''}</li>`)}
          </div>
          
          <div class="card">
            <h2>Lineups</h2>
            <div style="font-weight: 600; margin-bottom: 4px;">${data.homeTeam}${m.lineups?.home?.manager ? ` — Manager: ${m.lineups.home.manager}` : ''}</div>
            ${listOrEmpty(m.lineups?.home?.players, p => `<li>${p}</li>`)}
            ${m.lineups?.home?.substitutes?.length ? `
              <div style="font-size: 12px; color: var(--muted); margin-top: 8px;">Substitutes</div>
              ${listOrEmpty(m.lineups?.home?.substitutes, p => `<li>${p}</li>`)}
            ` : ''}
            <div style="font-weight: 600; margin: 14px 0 4px;">${data.awayTeam}${m.lineups?.away?.manager ? ` — Manager: ${m.lineups.away.manager}` : ''}</div>
            ${listOrEmpty(m.lineups?.away?.players, p => `<li>${p}</li>`)}
            ${m.lineups?.away?.substitutes?.length ? `
              <div style="font-size: 12px; color: var(--muted); margin-top: 8px;">Substitutes</div>
              ${listOrEmpty(m.lineups?.away?.substitutes, p => `<li>${p}</li>`)}
            ` : ''}
          </div>
        `;

        document.getElementById('content').innerHTML = html;

        const iso = data.fixtureDate;
        fetch(`matchday-archive/${iso}-raw-posts.json?t=` + Date.now())
          .then(res => res.json())
          .then(posts => {
            window.postsCarousel = createCarousel('posts-track', 'posts-dots', 'posts-count');

            if (!posts || posts.length === 0) {
              document.getElementById('posts-track').innerHTML = '<div class="empty" style="padding: 8px 0;">No posts recorded</div>';
              postsCarousel.setCount(0);
              return;
            }

            const newestFirst = [...posts].reverse();
            document.getElementById('posts-track').innerHTML = newestFirst.map(renderPost).join('');
            postsCarousel.setCount(newestFirst.length);
          })
          .catch(() => {
            document.getElementById('posts-track').innerHTML = '<div class="empty" style="padding: 8px 0;">No posts recorded</div>';
          });
      })
      .catch(err => {
        document.getElementById('content').textContent = 'Failed to load matchday data';
        console.error(err);
      });
  </script>
</body>
</html>
