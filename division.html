<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandbach United — Division Round-Up</title>
  <style>
    :root {
      --navy: #0c2340;
      --royal: #1c5fae;
      --amber: #f2a71b;
      --paper: #eef1f6;
      --ink: #14202b;
      --muted: #6b7785;
      --line: #e3e7ee;
    }
    body {
      font-family: system-ui, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 0 16px;
      background: var(--paper);
      color: var(--ink);
    }
    h1 { color: var(--navy); font-size: 22px; }
    a.back { display: inline-block; margin-bottom: 16px; color: var(--royal); text-decoration: none; }
    .card {
      background: white;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 1px 3px rgba(12,35,64,0.08);
    }
    .card h2 {
      margin: 0 0 12px 0;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--navy);
      display: inline-block;
      padding-bottom: 6px;
      border-bottom: 3px solid var(--amber);
    }
    .subhead {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--royal);
      margin: 14px 0 6px;
    }
    .subhead:first-of-type { margin-top: 0; }
    .summary { line-height: 1.6; white-space: pre-wrap; }
    .meta { color: var(--muted); font-size: 13px; margin-top: 12px; }
    .empty { color: var(--muted); font-size: 13px; font-style: italic; }
  </style>
</head>
<body>
  <a class="back" href="index.html">← Back</a>
  <h1>First Division South — Round-Up</h1>

  <div class="card">
    <h2>Weekend Preview</h2>
    <div id="weekend-preview" class="summary">Loading...</div>
    <div class="meta" id="weekend-preview-updated"></div>
  </div>

  <div class="card">
    <h2>Weekend Recap</h2>
    <div id="weekend-recap-content">Loading...</div>
    <div class="meta" id="weekend-recap-updated"></div>
  </div>

  <div class="card">
    <h2>Midweek Preview</h2>
    <div id="midweek-preview" class="summary">Loading...</div>
    <div class="meta" id="midweek-preview-updated"></div>
  </div>

  <div class="card">
    <h2>Midweek Recap</h2>
    <div id="midweek-recap-content">Loading...</div>
    <div class="meta" id="midweek-recap-updated"></div>
  </div>

  <script>
    function loadPreview(mode, contentId, metaId) {
      fetch(`division-insights-${mode}.json?t=` + Date.now())
        .then(res => res.json())
        .then(data => {
          if (!data.sandbachFocus && !data.divisionWide && !data.summary) {
            document.getElementById(contentId).innerHTML = '<span class="empty">Not available yet.</span>';
            return;
          }
          if (data.sandbachFocus || data.divisionWide) {
            document.getElementById(contentId).innerHTML = `
              ${data.sandbachFocus ? `<div class="subhead">Sandbach United</div><div class="summary">${data.sandbachFocus}</div>` : ''}
              ${data.divisionWide ? `<div class="subhead">Around the Division</div><div class="summary">${data.divisionWide}</div>` : ''}
            `;
          } else {
            document.getElementById(contentId).textContent = data.summary;
          }
          const date = new Date(data.generatedAt);
          document.getElementById(metaId).textContent =
            'Updated ' + date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) +
            ' at ' + date.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
        })
        .catch(() => {
          document.getElementById(contentId).innerHTML = '<span class="empty">Not available yet — check back after the next preview window.</span>';
        });
    }

    function loadRecap(mode, contentId, metaId) {
      fetch(`division-insights-${mode}.json?t=` + Date.now())
        .then(res => res.json())
        .then(data => {
          if (!data.sandbachFocus && !data.divisionWide) {
            document.getElementById(contentId).innerHTML = '<span class="empty">Not available yet.</span>';
            return;
          }
          document.getElementById(contentId).innerHTML = `
            ${data.sandbachFocus ? `<div class="subhead">Sandbach United</div><div class="summary">${data.sandbachFocus}</div>` : ''}
            ${data.divisionWide ? `<div class="subhead">Around the Division</div><div class="summary">${data.divisionWide}</div>` : ''}
          `;
          const date = new Date(data.generatedAt);
          document.getElementById(metaId).textContent =
            'Updated ' + date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) +
            ' at ' + date.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
        })
        .catch(() => {
          document.getElementById(contentId).innerHTML = '<span class="empty">Not available yet — check back after the next recap window.</span>';
        });
    }

    loadPreview('weekend-preview', 'weekend-preview', 'weekend-preview-updated');
    loadRecap('weekend-recap', 'weekend-recap-content', 'weekend-recap-updated');
    loadPreview('midweek-preview', 'midweek-preview', 'midweek-preview-updated');
    loadRecap('midweek-recap', 'midweek-recap-content', 'midweek-recap-updated');
  </script>
</body>
</html>
