name: Poll X

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - run: node x-posts.js
        env:
          GETXAPI_KEY: ${{ secrets.GETXAPI_KEY }}
      - run: node nwcfl-news.js
      - run: node x-insights.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in x-posts.json x-posts-lastpoll.json x-insights.json user-ids.json nwcfl-news.json nwcfl-news-seen.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "Update X posts and insights"
          git push