name: Division recap - weekend recap
on:
  workflow_dispatch:

concurrency:
  group: division-scores
  cancel-in-progress: false


permissions:
  contents: write
  
jobs:
  recap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - id: gate
        run: node recap-gate.js >> "$GITHUB_OUTPUT"
        env:
          RECAP_MODE: weekend-recap
      - if: steps.gate.outputs.run == 'true'
        run: node division-posts.js
        env:
          GETXAPI_KEY: ${{ secrets.GETXAPI_KEY }}
      - if: steps.gate.outputs.run == 'true'
        run: node division-recap-engine.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RECAP_MODE: weekend-recap
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in division-posts.json division-insights-weekend-recap.json .recap-state-weekend-recap.json cost-log.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "Weekend recap"
          git pull --rebase --autostash origin main
          git push