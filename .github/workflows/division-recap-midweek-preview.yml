name: Division recap - midweek preview
on:
  workflow_dispatch:

concurrency:
  group: division-recap-midweek-preview
  cancel-in-progress: false


permissions:
  contents: write
  
jobs:
  recap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - id: gate
        run: node recap-gate.js >> "$GITHUB_OUTPUT"
        env:
          RECAP_MODE: weekend-recap
      - if: steps.gate.outputs.run == 'true'
        run: node division-posts.js
        env:
          GETXAPI_KEY: ${{ secrets.GETXAPI_KEY }}
      - if: steps.gate.outputs.run == 'true'
        run: node division-recap-engine.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RECAP_MODE: weekend-recap
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in division-posts.json division-insights-weekend-recap.json .recap-state-weekend-recap.json cost-log.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "Weekend recap"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main; then
              if git push; then
                break
              fi
              echo "Push rejected (race with another run), retrying..."
              sleep $((RANDOM % 5 + 1))
              continue
            fi
            git diff --name-only --diff-filter=U | while read -r f; do
              git checkout --theirs "$f" 2>/dev/null && git add "$f"
            done
            git rebase --continue || git rebase --abort
          done
          git push
