name: Scrape Sandbach fixtures
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - id: gate
        run: |
          node -e "
            const { shouldRunHourlyTask } = require('./hourly-gate.js');
            console.log(shouldRunHourlyTask() ? 'run=true' : 'run=false');
          " >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.run == 'true'
        run: node scrape.js
      - if: steps.gate.outputs.run == 'true'
        run: node league.js
      - if: steps.gate.outputs.run == 'true'
        run: node position-history.js
      - if: steps.gate.outputs.run == 'true'
        run: node player-tables.js
      - if: steps.gate.outputs.run == 'true'
        run: node attendance-stats.js
      - if: steps.gate.outputs.run == 'true'
        name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json league.json player-tables.json position-history.json attendance-stats.json .scrape-lastrun.json
          git diff --staged --quiet || git commit -m "Update fixture and league data"
          git push