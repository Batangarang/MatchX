name: Weekly division roundup

on:
  schedule:
    - cron: '0 15 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  roundup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - run: node division-posts.js
        env:
          GETXAPI_KEY: ${{ secrets.GETXAPI_KEY }}
      - run: node division-insight.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add division-posts.json division-insights.json user-ids.json
          git diff --staged --quiet || git commit -m "..."
          git pull --rebase --autostash origin main
          git push
