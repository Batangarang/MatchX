name: Matchday live tracker
on:
  workflow_dispatch:

concurrency:
  group: matchday-live
  cancel-in-progress: false
    
permissions:
  contents: write
jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - run: node matchday-live.js
        env:
          GETXAPI_KEY: ${{ secrets.GETXAPI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config core.editor true
          git add -A -- matchday-archive matchday-index.json matchday-live.json user-ids.json cost-log.json
          git diff --staged --quiet || git commit -m "..."
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main; then
              if git push; then
                break
              fi
              echo "Push rejected (race with another run), retrying..."
              sleep $((RANDOM % 5 + 1))
              continue
            fi
            git diff --name-only --diff-filter=U | while read -r f; do
              git checkout --theirs "$f" 2>/dev/null && git add "$f"
            done
            git rebase --continue || git rebase --abort
          done
          git push
